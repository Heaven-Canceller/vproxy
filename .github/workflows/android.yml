name: Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - name: Build development-signed APK
        shell: pwsh
        run: ./android/build.ps1 -Abi ${{ matrix.abi }}
      - uses: actions/upload-artifact@v4
        with:
          name: vproxy-android-${{ matrix.abi }}
          path: dist/*.apk
